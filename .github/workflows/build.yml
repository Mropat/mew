name: build

# Monorepo: one folder per mod. A tag like `mewdaily-v1.0.0` builds ./mewdaily
# and attaches the DLL to that release.
on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      mod:
        description: mod folder to build
        required: true
        default: mewdaily

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach the DLL to a release
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mod folder
        id: mod
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dir=${{ github.event.inputs.mod }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: cd ${{ steps.mod.outputs.dir }} && build.bat

      # The tests only ever ran on a developer machine, with a different
      # compiler than the one that builds what people download. Three alignment
      # bugs reached a release that way: clang happened to place structs on 16
      # and MSVC did not. Run them here, against the shipping codegen.
      - name: Test
        shell: cmd
        working-directory: ${{ steps.mod.outputs.dir }}
        run: |
          for %%t in (test_*.cpp) do (
            echo === %%t ===
            cl /nologo /EHsc /O2 /I..\common %%t /Fe:%%~nt.exe || exit /b 1
            %%~nt.exe || exit /b 1
          )

      - name: SHA-256
        shell: cmd
        run: certutil -hashfile ${{ steps.mod.outputs.dir }}\${{ steps.mod.outputs.dir }}.dll SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.dir }}
          path: |
            ${{ steps.mod.outputs.dir }}/${{ steps.mod.outputs.dir }}.dll
            ${{ steps.mod.outputs.dir }}/dllmain.cpp

      # Published as a prerelease. What gets tested has to be the artifact
      # people download, not a local build of the same source, so promoting to a
      # full release is a deliberate step after that has actually happened:
      #     gh release edit <tag> --prerelease=false --latest
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: ${{ steps.mod.outputs.dir }}/${{ steps.mod.outputs.dir }}.dll
